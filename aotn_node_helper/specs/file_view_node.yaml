node_type: 'file_view_node'
class_name: 'FileViewNode'
category: 'io'
primary_family: 'Outputs'
tags: ['File I/O', 'Active Output']
icon_name: 'file-search'
display_name: 'File Manager'
default_alias: 'File Manager'
description: 'Display a text or Markdown file inside AOTN'
inputs:
  file:
    type: 'file'
    required: True
    label: 'File'
    description: 'File reference from upstream/vault, or a configured path'
    sources: ['upstream', 'vault', 'configured']
    default: 'upstream'
    parameter:
      type: 'string'
      label: 'File path'
      placeholder: '/path/to/notes.md'
      path_hint: 'file'
      normalize_local_path: True
      required: True
outputs:
  default:
    name: 'File Reference'
    type: 'file'
    required: True
    to: ['downstream', 'vault']
    pass_through: True
    description: "The viewed file's reference, forwarded for further steps"
output_routing:
  default: 'transient'
  vault:
    mode: 'optional'
config_tabs:
  Parameters:
    render:
      type: 'select'
      label: 'Render as'
      options: ['Auto', 'Markdown', 'Plain text']
      default: 'Auto'
      description: 'Auto picks Markdown for .md/.markdown files'
    additional_files:
      type: 'object_list'
      label: 'Additional files'
      default: []
      item_schema:
        id:
          type: 'string'
          label: 'Stable id'
        path:
          type: 'string'
          label: 'File path'
          path_hint: 'file'
          normalize_local_path: True
        vault_key:
          type: 'string'
          label: 'Vault key'
        description:
          type: 'string'
          label: 'Description'
  Payloads:
    downstream_file_id:
      type: 'select'
      label: 'Downstream file'
      options: ['primary']
      default: 'primary'
      options_from: 'additional_files'
      options_include: [['Primary file', 'primary']]
execution_template: 'output_sink'
ui_hints:
  forwarded_input_port: 'file'
