node_type: http_request_node
class_name: HttpRequestNode
category: io
primary_family: Inputs
tags: ["Internet"]
group: "Web Request"
selector_section: "Web"
icon_name: globe
display_name: HTTP Request
default_alias: HTTP Request
description: Make an HTTP GET or POST request and forward the response body (as text, or saved to a run-owned file)
input_ports: ["input"]
output_ports: ["default", "error"]
config_tabs:
  Parameters:
    url:
      type: string
      label: URL
      placeholder: "https://example.com/api"
      default: ""
      required: true
    method:
      type: select
      label: Method
      options: ["GET", "POST"]
      default: GET
    body_source:
      type: select
      label: "Body from (POST)"
      options: ["config", "input"]
      default: config
      description: "config sends the Request body field; input sends the node's input (text as is, anything else as JSON)"
      visible_when:
        method: POST
    body:
      type: multiline
      label: "Request body (POST)"
      default: ""
      required: false
      visible_when:
        method: POST
    response_mode:
      type: select
      label: "Response as"
      options: ["text", "file"]
      default: text
      description: "text decodes the body; file saves the raw bytes to a run-owned file and outputs a file reference"
    keep_response_file:
      type: boolean
      label: "Keep the response file after the run"
      default: false
      description: "Off: the file is deleted when the run succeeds (kept if it fails). On: always kept."
      visible_when:
        response_mode: file
    timeout_seconds:
      type: float
      label: Timeout (seconds)
      default: 10.0
      required: false
    auth_token_secret:
      type: string
      label: "Bearer token (secrets store key)"
      secret: true
      default: ""
      required: false
errors:
  - code: missing_url
    description: "No URL is configured."
    retryable: false
  - code: timeout
    description: "The server did not answer within the timeout."
    retryable: true
  - code: network
    description: "The request could not reach the server (DNS, refused, TLS...)."
    retryable: true
  - code: http_status
    description: "The server answered with an HTTP error status (details carry status and body)."
    retryable: false
execution_template: transform_stub
