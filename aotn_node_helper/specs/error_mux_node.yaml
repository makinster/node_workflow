node_type: error_mux_node
class_name: ErrorMuxNode
category: flow
primary_family: Flow Control
tags: ["Conditional"]
icon_name: git-fork
display_name: Error Mux
default_alias: Error Mux
description: Place after a node to catch the errors you pick and send each down its own recovery branch
input_ports: ["input", "error"]
# Config-driven outputs (port model): "default" (No error) always, one port per
# recovery branch (its stable route id), and "unmatched" when "Any other error"
# is picked. Resolved by ErrorMuxNode.resolve_output_ports; the config UI is a
# custom section in node config (routes are not generic schema fields).
output_ports: ["default", "unmatched"]
input_port_metadata:
  input:
    name: Input
    description: "The guarded node's normal output; also how the mux catches that node's errors"
  error:
    name: Error
    description: "Optional: a node's error port wired here directly (older layout)"
output_port_metadata:
  default:
    name: No error
    description: "The guarded node's normal output, when it succeeds"
  unmatched:
    name: Any other error
    description: "Any failure no other recovery branch takes"
execution_template: transform_stub
