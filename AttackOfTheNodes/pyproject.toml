[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "AttackOfTheNodes"
version = "0.6.0"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2",
    "textual-dev>=1.8",
    "aiohttp>=3.14,<4",
    "anthropic>=2.3,<3",
    "jsonschema>=4.26,<5",
]

# Optional Windows window placement/control (FO4, D5 in
# docs/FILE_OUTPUT_BUILD_PLAN.md). Without it files still open; placement
# degrades with a logged warning. Install with: pip install -e ".[windows]"
[project.optional-dependencies]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "pytest-xdist>=3.8,<4"]
windows = ['pywin32>=306; platform_system == "Windows"']

[project.scripts]
aotn = "main:main"

[tool.setuptools]
py-modules = ["main", "aotn_cli", "aotn_author", "aotn_stash"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "frontend*", "aotn_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
